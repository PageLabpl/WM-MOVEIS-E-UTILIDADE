# Blueprint opcional do Render (Render > New > Blueprint).
# Você também pode simplesmente criar o Web Service manualmente pelo dashboard
# seguindo o README.md — o blueprint só automatiza esse processo.
#
# O banco de dados usado é o SUPABASE (não o Postgres do Render), por isso
# não há uma seção "databases:" aqui — DATABASE_URL é preenchida manualmente
# por você no dashboard do Render com a "Session pooler connection string"
# do seu projeto Supabase (Project > Connect > Session pooler).

services:
  - type: web
    name: wm-moveis-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false   # cole aqui a Session pooler connection string do Supabase
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: COOKIE_SECURE
        value: "true"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
